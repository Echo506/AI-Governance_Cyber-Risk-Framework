<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">NovaConnect AI Governance and Risk Framework</title>
  <desc id="desc">A diagram showing governance at the center, the NIST AI RMF lifecycle, cybersecurity controls, continuous monitoring, and documentation artifacts.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#071521"/>
      <stop offset="100%" stop-color="#0D2635"/>
    </linearGradient>
    <linearGradient id="govern" x1="0" x2="1">
      <stop offset="0%" stop-color="#00A6A6"/>
      <stop offset="100%" stop-color="#36C9BA"/>
    </linearGradient>
    <linearGradient id="map" x1="0" x2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="measure" x1="0" x2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="manage" x1="0" x2="1">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity=".25"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#75A7B9"/>
    </marker>
    <style>
      .heading { font-family: Arial, Helvetica, sans-serif; fill: #F6FAFC; font-weight: 700; }
      .body { font-family: Arial, Helvetica, sans-serif; fill: #C6D5DB; font-size: 17px; }
      .small { font-family: Arial, Helvetica, sans-serif; fill: #A4BAC3; font-size: 14px; }
      .label { font-family: Arial, Helvetica, sans-serif; fill: #F6FAFC; font-size: 18px; font-weight: 700; }
      .pill { font-family: Arial, Helvetica, sans-serif; fill: #DCEFF1; font-size: 14px; font-weight: 700; letter-spacing: 1px; }
      .node { stroke: #7CA6B3; stroke-opacity: .25; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="190" cy="100" r="240" fill="#00A6A6" opacity=".05"/>
  <circle cx="1470" cy="850" r="300" fill="#2563EB" opacity=".06"/>

  <text x="800" y="72" text-anchor="middle" class="heading" font-size="37">NovaConnect AI Governance &amp; Risk Framework</text>
  <text x="800" y="106" text-anchor="middle" class="body">Responsible AI adoption for NOC and technical-support operations</text>

  <!-- Governance band -->
  <rect x="170" y="145" width="1260" height="105" rx="18" fill="#102E3A" class="node"/>
  <rect x="190" y="164" width="290" height="67" rx="13" fill="url(#govern)" filter="url(#softGlow)"/>
  <text x="335" y="192" text-anchor="middle" class="heading" font-size="22">GOVERNANCE</text>
  <text x="335" y="215" text-anchor="middle" class="small" fill="#E7FFFF">Policy · Accountability · Risk Appetite</text>

  <text x="550" y="184" class="label">Executive Sponsor</text>
  <text x="550" y="211" class="body">AI Governance Owner · Business Owner · Technical Owner</text>

  <rect x="1138" y="170" width="250" height="55" rx="28" fill="#173D49" stroke="#51B7B9" stroke-opacity=".55"/>
  <text x="1263" y="204" text-anchor="middle" class="pill">HUMAN OVERSIGHT</text>

  <!-- arrows to lifecycle -->
  <path d="M800 252 L800 305" stroke="#75A7B9" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>

  <!-- Lifecycle cycle -->
  <path d="M440 455 C440 320 605 280 690 350" fill="none" stroke="#4F98A3" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M805 350 C970 280 1160 330 1160 455" fill="none" stroke="#4F98A3" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1160 570 C1160 700 980 745 895 675" fill="none" stroke="#4F98A3" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M690 675 C525 745 440 700 440 570" fill="none" stroke="#4F98A3" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- AI RMF nodes -->
  <g filter="url(#shadow)">
    <rect x="305" y="365" width="270" height="142" rx="20" fill="url(#govern)" class="node"/>
    <text x="440" y="413" text-anchor="middle" class="heading" font-size="28">GOVERN</text>
    <text x="440" y="443" text-anchor="middle" class="body" fill="#E8FFFF">Roles &amp; policy</text>
    <text x="440" y="468" text-anchor="middle" class="body" fill="#E8FFFF">Risk culture &amp; training</text>

    <rect x="1025" y="365" width="270" height="142" rx="20" fill="url(#map)" class="node"/>
    <text x="1160" y="413" text-anchor="middle" class="heading" font-size="28">MAP</text>
    <text x="1160" y="443" text-anchor="middle" class="body" fill="#EEF6FF">Context &amp; stakeholders</text>
    <text x="1160" y="468" text-anchor="middle" class="body" fill="#EEF6FF">Data &amp; impact analysis</text>

    <rect x="1025" y="583" width="270" height="142" rx="20" fill="url(#measure)" class="node"/>
    <text x="1160" y="631" text-anchor="middle" class="heading" font-size="28">MEASURE</text>
    <text x="1160" y="661" text-anchor="middle" class="body" fill="#F7F1FF">Testing &amp; validation</text>
    <text x="1160" y="686" text-anchor="middle" class="body" fill="#F7F1FF">Quality, security &amp; drift</text>

    <rect x="305" y="583" width="270" height="142" rx="20" fill="url(#manage)" class="node"/>
    <text x="440" y="631" text-anchor="middle" class="heading" font-size="28">MANAGE</text>
    <text x="440" y="661" text-anchor="middle" class="body" fill="#FFF5EC">Risk treatment &amp; response</text>
    <text x="440" y="686" text-anchor="middle" class="body" fill="#FFF5EC">Monitoring &amp; improvement</text>
  </g>

  <!-- Center -->
  <circle cx="800" cy="545" r="154" fill="#0A202B" stroke="#51B7B9" stroke-width="2.5" filter="url(#shadow)"/>
  <circle cx="800" cy="545" r="128" fill="none" stroke="#51B7B9" stroke-opacity=".22" stroke-width="1.5"/>
  <path d="M800 434 L884 466 L864 592 L800 655 L736 592 L716 466 Z" fill="#00A6A6" opacity=".15"/>
  <path d="M800 448 L867 474 L851 581 L800 637 L749 581 L733 474 Z" fill="none" stroke="#54D5CD" stroke-width="3"/>
  <path d="M774 545 L792 563 L831 520" fill="none" stroke="#54D5CD" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="687" text-anchor="middle" class="heading" font-size="23">NOVAASSIST</text>
  <text x="800" y="714" text-anchor="middle" class="small">Approved internal AI use case</text>

  <!-- Monitoring strip -->
  <rect x="170" y="790" width="1260" height="122" rx="18" fill="#102E3A" class="node"/>
  <text x="220" y="835" class="heading" font-size="23">CONTINUOUS MONITORING</text>
  <text x="220" y="865" class="body">KPIs · KRIs · Output quality · Access logs · Supplier changes · Incident lessons learned</text>

  <rect x="1015" y="813" width="150" height="54" rx="27" fill="#173D49" stroke="#8A76DB" stroke-opacity=".7"/>
  <text x="1090" y="846" text-anchor="middle" class="pill">MONITOR</text>

  <rect x="1180" y="813" width="205" height="54" rx="27" fill="#173D49" stroke="#51B7B9" stroke-opacity=".7"/>
  <text x="1282" y="846" text-anchor="middle" class="pill">IMPROVE &amp; REASSESS</text>

  <!-- Side artifacts -->
  <rect x="30" y="370" width="220" height="330" rx="16" fill="#0C2531" class="node"/>
  <text x="56" y="409" class="heading" font-size="17">DOCUMENTATION</text>
  <line x1="56" y1="424" x2="220" y2="424" stroke="#4F98A3" stroke-opacity=".5"/>
  <text x="56" y="461" class="small">• Governance policy</text>
  <text x="56" y="493" class="small">• System inventory</text>
  <text x="56" y="525" class="small">• Impact assessment</text>
  <text x="56" y="557" class="small">• Risk register</text>
  <text x="56" y="589" class="small">• Control mapping</text>
  <text x="56" y="621" class="small">• Supplier review</text>
  <text x="56" y="653" class="small">• Incident records</text>

  <rect x="1350" y="370" width="220" height="330" rx="16" fill="#0C2531" class="node"/>
  <text x="1376" y="409" class="heading" font-size="17">CONTROL AREAS</text>
  <line x1="1376" y1="424" x2="1540" y2="424" stroke="#4F98A3" stroke-opacity=".5"/>
  <text x="1376" y="461" class="small">• Data protection</text>
  <text x="1376" y="493" class="small">• IAM and MFA</text>
  <text x="1376" y="525" class="small">• Secure integrations</text>
  <text x="1376" y="557" class="small">• Logging and SIEM</text>
  <text x="1376" y="589" class="small">• Human validation</text>
  <text x="1376" y="621" class="small">• Incident response</text>
  <text x="1376" y="653" class="small">• Third-party assurance</text>

  <path d="M250 535 L300 535" stroke="#4F98A3" stroke-width="2" stroke-dasharray="5 6"/>
  <path d="M1300 535 L1350 535" stroke="#4F98A3" stroke-width="2" stroke-dasharray="5 6"/>

  <text x="800" y="954" text-anchor="middle" class="small">Aligned to NIST AI RMF and NIST Cybersecurity Framework 2.0</text>
</svg>
